<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Weylus_Osu</title>
    <link rel="stylesheet" href="style.css">
    <script src="lib.js"></script>
    <script>
        run("{{log_level}}");
    </script>
</head>

<body>
    <main id="main">
        <video id="video" autoplay muted defaultMuted playsinline disablePictureInPicture></video>
        <canvas id="canvas" class="vanish"></canvas>
        <div id="debug_overlay" class="hide"></div>
    </main>
    <div id="settings">
        <div id="handle" title="Show / hide settings">⠿</div>
        <div id="settings_scroll">
            <header class="panel-header">
                <h2>Weylus_Osu</h2>
                <span class="fps"><output id="fps">0</output> fps</span>
            </header>

            <h3>Tablet Area</h3>
            <section id="mapping_section">
                <label class="row"><span>Enable tablet area</span><input type="checkbox" id="enable_mapping" checked /></label>
                <div class="inline">
                    <select id="mapping_preset"></select>
                    <button id="save_mapping_preset" class="secondary" title="Save current area as preset">Save</button>
                    <button id="delete_mapping_preset" class="secondary danger" title="Delete selected preset">Delete</button>
                </div>
                <output id="mapping_info" class="readout"></output>
                <button id="toggle_mapping_edit">Edit Area</button>
            </section>

            <h3>Screen</h3>
            <section id="video_section">
                <label class="stack"><span>Capture source</span>
                    <div class="inline">
                        <select id="window"></select>
                        <button id="refresh" class="secondary" title="Refresh list">Refresh</button>
                    </div>
                </label>
                <label class="row"><span>Show screen in tablet area</span><input type="checkbox" id="enable_video" checked /></label>
                <label class="row"><span>Stretch to fill area</span><input type="checkbox" id="stretch" checked /></label>
                <label class="row"><span>Low latency <small>(may stutter)</small></span><input type="checkbox" id="aggressive_seeking" checked /></label>
                <label class="row {{#if (not capture_cursor_enabled)}}hide{{/if}}"><span>Capture cursor</span><input type="checkbox" id="capture_cursor" /></label>
                <label class="row"><span>Energy saving <small>(black screen, no video)</small></span><input type="checkbox" id="energysaving" /></label>
                <label class="stack"><span>Resolution <output id="scale_video_value" class="value"></output></span>
                    <input type="range" id="scale_video" min="0.1" max="2" step="0.01" value="1.8" /></label>
                <label class="stack"><span>Frame rate <output id="frame_rate_value" class="value">30</output></span>
                    <input type="range" id="frame_rate" value="0" /></label>
                <button id="fullscreen" class="secondary">Toggle Fullscreen</button>
            </section>

            <h3>Input</h3>
            <section>
                <label class="row"><span>Stylus</span><input type="checkbox" id="enable_stylus" checked /></label>
                <label class="row"><span>Touch</span><input type="checkbox" id="enable_touch" checked /></label>
                <label class="row"><span>Mouse</span><input type="checkbox" id="enable_mouse" checked /></label>
                <label class="row {{#if (not uinput_enabled)}}hide{{/if}}"><span>Use uinput</span><input type="checkbox" id="uinput_support" checked /></label>
                <label class="stack"><span>Minimum pressure <output id="min_pressure_value" class="value"></output></span>
                    <input type="range" id="min_pressure" min="0" max="1" step="0.01" value="0" /></label>
                <label class="row {{#if (not enable_custom_input_areas)}}hide{{/if}}"><span>Custom input area</span><input type="checkbox" id="enable_custom_input_areas" /></label>
                <button id="custom_input_areas" class="secondary {{#if (not enable_custom_input_areas)}}hide{{/if}}">Choose Custom Input Area</button>
            </section>

            <h3>Advanced</h3>
            <section>
                <label class="stack {{#if (not uinput_enabled)}}hide{{/if}}"><span>Client name <small>(to tell devices apart)</small></span>
                    <input type="text" id="client_name" /></label>
                <label class="row"><span>Debug overlay</span><input type="checkbox" id="enable_debug_overlay" /></label>
            </section>

            <section id="log_section" class="hide">
                <h3>Log</h3>
                <pre class="log" id="log"></pre>
            </section>

            <footer id="displayoptions">
                <label id="leftylabel"><input type="checkbox" id="lefty" /> <span>Panel on left</span></label>
                <button id="vanish" class="secondary" title="Hide this panel until the page is reloaded">Hide until reload</button>
            </footer>
        </div>
    </div>
</body>

</html>
